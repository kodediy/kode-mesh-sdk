version: "0.1.0"
description: "The Mesh module's drivers: the LR2021 over SPI, LoRa's arithmetic, the GNSS over UART and its NMEA, the fingerprint's pins"
url: "https://docs.kode.diy/modules/mesh"
repository: "https://github.com/kodediy/kode-mesh-sdk.git"
issues: "https://github.com/kodediy/kode-mesh-sdk/issues"
discussion: "https://github.com/kodediy/kode-mesh-sdk/discussions"
repository_info:
  path: "components/mesh_drv"
license: "GPL-3.0-or-later"
tags:
  - kode-dot
  - lora
  - gnss
  - lr2021
targets:
  - esp32p4

## The board's facts, kode_status_t and the log. kode-sdk is not pinned here:
## the app pins it, and kodediy/kode brings kdefs and klog with it at the
## release the app chose (this tree is built against v0.1.5). Siblings as in
## mesh's manifest.
dependencies:
  idf: ">=6.1"
  kodediy/mesh_bsp: {version: "==0.1.0", override_path: "../mesh_bsp"}
